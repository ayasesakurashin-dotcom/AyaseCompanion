[package]
name = "ayase-companion"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
smoke-test = []

[dependencies]
ayase-core = { path = "../../../crates/ayase-core" }
tauri = { version = "=2.9.5", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-single-instance = "=2.3.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
pulldown-cmark = { version = "=0.13.5", default-features = false }
regex = "1"
image = { version = "=0.25.9", default-features = false, features = ["png", "webp"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
chrono = "=0.4.43"
uuid = { version = "=1.19.0", features = ["v4"] }
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Devices_Geolocation", "Security_Authorization_AppCapabilityAccess", "Win32_System_LibraryLoader", "Media_Control", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_Com", "Win32_System_RemoteDesktop", "Win32_Security_Cryptography", "Win32_System_Memory"] }
